name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tap
          POSTGRES_PASSWORD: tap
          POSTGRES_DB: tap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tap" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tap:tap@localhost:5432/tap_test?schema=public
      TEST_DATABASE_URL: postgresql://tap:tap@localhost:5432/tap_test?schema=public
      SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
