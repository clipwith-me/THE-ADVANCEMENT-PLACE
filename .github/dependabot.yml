# Keeps dependencies current without a developer. Minor/patch updates are
# grouped into one PR a month and merged automatically once CI passes
# (see workflows/dependabot-automerge.yml). Major upgrades stay open for review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
