# Render Blueprint — creates the web service from this repository.
# In Render: New → Blueprint → select this repo. Secrets marked `sync: false`
# are entered in the Render dashboard when the Blueprint is applied.
services:
  - type: web
    name: the-advancement-place
    runtime: node
    plan: starter            # always-on, 512 MB — see docs/deployment.md
    region: frankfurt        # closest Render region to Nigeria
    branch: main
    # --include=dev: the build needs TypeScript, Tailwind and the Prisma CLI.
    buildCommand: npm ci --include=dev && npm run build
    # Runs before each release goes live: apply new migrations, then the
    # idempotent reference seed (categories + settings row). Never seeds demo data.
    preDeployCommand: npm run db:migrate:deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://theadvancementplace.com
      - key: SESSION_SECRET
        generateValue: true  # random value generated by Render on first apply
      - key: DATABASE_URL
        sync: false          # Neon POOLED connection string (host contains -pooler), sslmode=require
      - key: DIRECT_DATABASE_URL
        sync: false          # Neon DIRECT connection string — used only for migrations
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false          # Brevo SMTP login
      - key: SMTP_PASSWORD
        sync: false          # Brevo SMTP key
      - key: EMAIL_FROM
        value: The Advancement Place <no-reply@theadvancementplace.com>
      - key: NOTIFY_EMAIL
        value: advancementplace@gmail.com
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"       # set to "true" once Brevo sending is verified
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: RETENTION_DAYS
        value: "365"
      - key: LOG_LEVEL
        value: info
